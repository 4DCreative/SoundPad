name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained Windows build
        run: >
          dotnet publish src/SoundPad/SoundPad.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/SoundPad-win-x64
      - name: Create ZIP archive
        shell: pwsh
        run: Compress-Archive -Path publish/SoundPad-win-x64/* -DestinationPath SoundPad-${{ github.ref_name }}-win-x64.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} SoundPad-${{ github.ref_name }}-win-x64.zip --title "SoundPad ${{ github.ref_name }}" --generate-notes
